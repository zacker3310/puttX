<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="pxField" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#2C6B4C"/>
      <stop offset=".55" stop-color="#173F2D"/>
      <stop offset="1" stop-color="#0A2218"/>
    </radialGradient>
    <linearGradient id="pxBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E3AE"/>
      <stop offset=".42" stop-color="#D6B66E"/>
      <stop offset="1" stop-color="#A07C3A"/>
    </linearGradient>
    <linearGradient id="pxShaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DDA2"/>
      <stop offset="1" stop-color="#B8934B"/>
    </linearGradient>
    <radialGradient id="pxBall" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#F4EFE1"/>
      <stop offset="1" stop-color="#C9BE9F"/>
    </radialGradient>
  </defs>
  <!-- field -->
  <rect width="1024" height="1024" rx="228" fill="url(#pxField)"/>
  <rect x="46" y="46" width="932" height="932" rx="186" fill="none" stroke="#D6B66E" stroke-opacity=".5" stroke-width="6"/>
  <!-- the crest: a heater shield with a brass rule -->
  <path d="M512 168C616 206 708 214 806 206V506C806 690 688 806 512 884 336 806 218 690 218 506V206C316 214 408 206 512 168Z"
        fill="#0C2B1F" fill-opacity=".6" stroke="url(#pxBrass)" stroke-width="30" stroke-linejoin="round"/>
  <!-- crossed putters: the X of puttX (grips up, blades down and out) -->
  <g stroke-linecap="round">
    <path d="M352 318 662 650" stroke="url(#pxShaft)" stroke-width="46"/>
    <path d="M672 318 362 650" stroke="url(#pxShaft)" stroke-width="46"/>
    <path d="M352 318 426 397" stroke="#6A4D22" stroke-width="64"/>
    <path d="M672 318 598 397" stroke="#6A4D22" stroke-width="64"/>
    <path d="M352 318 366 333" stroke="#9C7838" stroke-width="64"/>
    <path d="M672 318 658 333" stroke="#9C7838" stroke-width="64"/>
  </g>
  <path d="M636 642H728a26 26 0 0 1 0 52H648a22 22 0 0 1-22-22V652a10 10 0 0 1 10-10Z" fill="url(#pxBrass)" stroke="#6E5427" stroke-width="8" stroke-linejoin="round"/>
  <path d="M388 642H296a26 26 0 0 0 0 52H376a22 22 0 0 0 22-22V652a10 10 0 0 0-10-10Z" fill="url(#pxBrass)" stroke="#6E5427" stroke-width="8" stroke-linejoin="round"/>
  <path d="M690 652V666M334 652V666" stroke="#FFF6DC" stroke-width="6" stroke-linecap="round"/>
  <!-- the ball, resting in the V -->
  <circle cx="512" cy="312" r="90" fill="url(#pxBall)"/>
  <g fill="#B9AE90" fill-opacity=".55">
    <circle cx="482" cy="292" r="9"/><circle cx="516" cy="282" r="9"/><circle cx="546" cy="300" r="9"/>
    <circle cx="496" cy="326" r="9"/><circle cx="532" cy="336" r="9"/><circle cx="560" cy="334" r="8"/>
    <circle cx="468" cy="330" r="8"/><circle cx="512" cy="360" r="8"/>
  </g>
