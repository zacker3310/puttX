# XcodeGen spec for the PuttX app: `cd ios && xcodegen` writes PuttX.xcodeproj (not committed).
name: PuttX
options:
  bundleIdPrefix: com.puttx
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PuttXCore:
    path: PuttXCore
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  PuttX:
    type: application
    platform: iOS
    sources:
      - path: PuttX
        excludes:
          - "Scene/**"
      # the exported course scenery, kept as a folder in the bundle (Scene/geo, Scene/tex, Scene/holes)
      - path: PuttX/Scene
        type: folder
        buildPhase: resources
    dependencies:
      - package: PuttXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puttx.app
        # Game Center and iCloud key-value saves (a team must be set to sign them)
        CODE_SIGN_ENTITLEMENTS: PuttX/PuttX.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PuttX
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: PuttX/Info.plist
      properties:
        # 120 Hz on ProMotion iPhones (iPads allow it already)
        CADisableMinimumFrameDurationOnPhone: true
        # game controllers drive play; Game Mode gives the game the device's full attention
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
